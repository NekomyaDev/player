<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Player smoke test</title>
<canvas id="c" style="width: 320px; height: 400px"></canvas>
<script type="module">
  // Run by smoke.mjs against the built package (dist/): every featured character loads, draws, takes each expression
  // and action without a WebGL error, and shows its mark; one loads from files instead of a URL, and again as the v3
  // package of the same model (it must draw the same pixels); a model of a newer format is refused.
  import { FORMAT_VERSION, LEGACY_FORMAT, Player } from '../dist/index.js'
  import { startLipSync } from '../dist/voice.js'

  const canvas = document.getElementById('c')
  const g = document.createElement('canvas').getContext('2d', { willReadFrequently: true })

  /** the canvas's pixels now */
  function pixels() {
    g.canvas.width = canvas.width; g.canvas.height = canvas.height
    g.clearRect(0, 0, canvas.width, canvas.height)
    g.drawImage(canvas, 0, 0)
    return g.getImageData(0, 0, canvas.width, canvas.height).data
  }

  /** share of the canvas the character covers (alpha above 0) */
  function covered() {
    const d = pixels()
    let n = 0
    for (let i = 3; i < d.length; i += 4) if (d[i] > 0) n++
    return n / (d.length / 4)
  }

  /** share of the pixels two frames differ in; outside: only those outside the bottom-right quarter */
  function changed(a, b, outside = false) {
    const w = canvas.width, h = canvas.height
    let n = 0
    for (let i = 0; i < a.length; i += 4) {
      const p = i >> 2, x = p % w, y = (p - x) / w
      if (outside && x >= w / 2 && y >= h / 2) continue
      if (Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]), Math.abs(a[i + 3] - b[i + 3])) > 8) n++
    }
    return n / (a.length / 4)
  }

  let FILES = {}
  window.setFiles = (files) => { FILES = files }
  /** a model as files (path -> Blob) under a folder, as a folder picked in the browser gives them: its model.json as
   *  given, everything else as the folder has it */
  async function filesOf(id, model, swap = {}) {
    const files = new Map([[`${id}/model.json`, typeof model === 'string' ? new Blob([model]) : new Blob([JSON.stringify(model)])]])
    for (const f of FILES[id]) if (f !== 'model.json') files.set(`${id}/${f}`, swap[f] ?? await (await fetch(`../characters/${id}/${f}`)).blob())
    for (const [f, b] of Object.entries(swap)) files.set(`${id}/${f}`, b)
    return files
  }
  const json = async (id) => (await fetch(`../characters/${id}/model.json`)).json()
  /** the same model with its mark turned off */
  const bare = (m) => (m.meta ? { ...m, meta: { ...m.meta, watermark: { kind: 'none' } } } : { ...m, watermark: null })

  /** one frame of a model by a fresh, still player (no idle motion): the same pixels every time but for the mark; and
   *  the model as the player drew it */
  async function still(source) {
    const p = new Player(canvas, { autoplay: false, followPointer: false, idle: false })
    const info = await p.load(source)
    p.resize()
    const d = pixels(), drawn = JSON.parse(JSON.stringify(p.puppet.model)), keys = p.puppet.keys.length
    p.dispose()
    return { d, info, drawn, keys }
  }

  /** what the model's mark changes in a still frame (drawn as it comes, and with the mark off), how much of that lies
   *  outside the bottom-right quarter (the corner mark alone: none), and what two frames without it differ in (should be
   *  nothing: else the first number says nothing about the mark) */
  async function markShare(id) {
    const m = await json(id)
    const a = await still(`../characters/${id}/`), b = await still(await filesOf(id, bare(m))), c = await still(await filesOf(id, bare(m)))
    return { mark: changed(a.d, b.d), outside: changed(a.d, b.d, true), noise: changed(b.d, c.d) }
  }

  window.run = async ({ ids, files }) => {
    FILES = files
    const player = new Player(canvas, { autoplay: false, followPointer: false, lang: 'en' })
    const gl = player.puppet.gl
    const out = []
    for (const id of ids) {
      const t0 = performance.now()
      try {
        const m = await player.load(`../characters/${id}/`)
        const ms = Math.round(performance.now() - t0)
        player.resize()
        const share = covered()
        for (const e of m.expressions) { player.setExpression(e.id); player.resize() }
        player.setExpression(null)
        for (const a of ['nod', 'shake', 'tilt', 'hop', 'shy']) player.act(a)
        player.params.mouthOpen = 1
        player.resize()
        player.params.mouthOpen = 0
        out.push({ id, name: m.name, format: `${m.format} ${m.version}`, ms, share: Math.round(share * 1000) / 1000,
          expressions: m.expressions.map((e) => e.label).join(' / '), glError: gl.getError(), watermark: m.watermark,
          license: m.meta?.license?.id ?? null })
      } catch (e) {
        out.push({ id, error: String(e.message || e) })
      }
    }

    // from files: the same model as a Map of path -> Blob
    const id = ids[0], model = await json(id)
    let fromFiles
    try {
      const m = await player.load(await filesOf(id, model))
      player.resize()
      fromFiles = { name: m.name, share: Math.round(covered() * 1000) / 1000 }
    } catch (e) {
      fromFiles = { error: String(e.message || e) }
    }

    // the same characters as one file from a URL (made by the build): the same frame, keyforms and all
    const packaged = []
    for (const p of ids.filter((i) => i === id || FILES[i].includes('keyforms.json'))) {
      const a = await still(`../characters/${p}/`), b = await still(`../characters/${p}.livliv`)
      packaged.push({ id: p, changed: changed(a.d, b.d), keys: [a.keys, b.keys] })
    }

    // a VRM handed to a Player: refused, saying where it belongs
    const vrmHere = await player.load(new File([await (await fetch('/__tiny.vrm')).blob()], 'x.vrm')).then(() => 'loaded', (e) => e.message)
    const vrmFolder = await player.load(new Map([['a/x.vrm', new Blob(['x'])]])).then(() => 'loaded', (e) => e.message)

    // what a load rejects with says what went wrong, in code
    const codeOf = (source) => player.load(source).then(() => 'loaded', (e) => (e.name === 'LivLivError' ? e.code : `not a LivLivError: ${e.name} ${e.message}`))
    const codes = {
      'http': await codeOf('/__nothing-here.livliv'), 'not-a-model': await codeOf(new File([new Blob(['just text'])], 'x.livliv')),
      'not-a-model json': await codeOf(new Map([['model.json', new Blob([JSON.stringify({ format: 'something else' })])]])),
      'not-a-model vrm': await codeOf(new File([await (await fetch('/__tiny.vrm')).blob()], 'x.vrm')),
      'newer-format': await codeOf(new Map([['model.json', new Blob([JSON.stringify({ ...model, version: FORMAT_VERSION + 1 })])]])),
      'missing-feature': await codeOf(new Map([['model.json', new Blob([JSON.stringify({ ...model, requires: ['from-the-future'] })])]])),
      'missing-file': await codeOf(new Map([['model.json', new Blob([JSON.stringify(model)])]])),
      'missing-file none': await codeOf(new Map([['a.txt', new Blob(['x'])]])),
      'invalid': await codeOf(new Map([['model.json', new Blob([JSON.stringify({ ...model, layers: [] })])]])),
      'too-large': await codeOf(new Map([['model.json', new Blob([JSON.stringify({ ...model, canvas: [100000, 100] })])]])),
    }

    // a newer format: refused, and the model before stays
    let newer
    try {
      await player.load(new Map([['model.json', new Blob([JSON.stringify({ ...model, version: FORMAT_VERSION + 1 })])]]))
      newer = { error: 'loaded' }
    } catch (e) {
      newer = { message: String(e.message || e), kept: player.model?.name }
    }
    player.dispose()

    // the mark: what it changes in a still frame of each (a fresh player each time, on the same canvas)
    for (const r of out) if (!r.error) Object.assign(r, await markShare(r.id))

    // a package from before v4: the model as the player draws it, written as v3, must draw the same pixels (both
    // without the mark: v3 cannot ask for the corner one alone, which the featured characters do)
    let legacy
    try {
      const v4 = await still(await filesOf(id, bare(model)))
      const { meta, files: _, ...v3 } = { ...v4.drawn, format: LEGACY_FORMAT, version: 3, watermark: null }
      const old = await still(await filesOf(id, v3))
      legacy = { format: `${old.info.format} ${old.info.version}`, watermark: old.info.watermark, changed: changed(v4.d, old.d) }
    } catch (e) {
      legacy = { error: String(e.message || e) }
    }
    return { out, fromFiles, newer, legacy, packaged, vrmHere, vrmFolder, codes }
  }

  /** disposing while something runs: a load rejects and leaves nothing on the GPU or the canvas; a driver added to a
   *  disposed player is disposed; a microphone that opens after it is let go */
  window.runLifecycle = async (id) => {
    const out = { supported: Player.isSupported() }
    const c = document.createElement('canvas')
    c.style.cssText = 'width: 200px; height: 200px'
    document.body.append(c)
    {
      const p = new Player(c, { followPointer: false }), gl = p.puppet.gl
      let made = 0, freed = 0
      const { createTexture, deleteTexture } = gl
      gl.createTexture = function () { made++; return createTexture.call(gl) }
      gl.deleteTexture = function (t) { if (t) freed++; return deleteTexture.call(gl, t) }
      // disposed just as the images start coming in (a timer could lose the race to a quick load)
      const loadModel = p.puppet.loadModel.bind(p.puppet)
      p.puppet.loadModel = (...args) => { p.dispose(); return loadModel(...args) }
      out.load = await p.load(`../characters/${id}/`).then(() => 'resolved', (e) => `${e.name}: ${e.message}`)
      p.resize()
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))
      const px = new Uint8Array(4)
      gl.readPixels(100, 100, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px)
      Object.assign(out, { model: p.model, drawn: px[3], made, freed, glError: gl.getError() })
    }
    {
      // what several loads and a dispose leave on the GPU
      const p = new Player(c, { autoplay: false, followPointer: false }), gl = p.puppet.gl
      const left = { texture: 0, buffer: 0, vertexArray: 0 }
      for (const [kind, make, free] of [['texture', 'createTexture', 'deleteTexture'], ['buffer', 'createBuffer', 'deleteBuffer'], ['vertexArray', 'createVertexArray', 'deleteVertexArray']]) {
        const m = gl[make], f = gl[free]
        gl[make] = function () { left[kind]++; return m.call(gl) }
        gl[free] = function (t) { if (t) left[kind]--; return f.call(gl, t) }
      }
      for (let i = 0; i < 3; i++) await p.load(`../characters/${id}/`)
      p.dispose()
      for (const k of ['createTexture', 'deleteTexture', 'createBuffer', 'deleteBuffer', 'createVertexArray', 'deleteVertexArray']) delete gl[k]
      out.left = left
    }
    {
      const p = new Player(c, { followPointer: false })
      p.dispose()
      let disposed = 0
      const remove = p.use({ update() {}, dispose() { disposed++ } })
      remove()
      out.driver = disposed
      const again = new Player(c, { followPointer: false })
      await again.load(`../characters/${id}/`)
      again.resize()
      out.again = again.model?.name ?? null
      const real = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices)
      let stream
      navigator.mediaDevices.getUserMedia = async (k) => { stream = await real(k); return stream }
      const starting = startLipSync(again)
      again.dispose()
      await starting
      navigator.mediaDevices.getUserMedia = real
      out.mic = stream.getTracks()[0].readyState
    }
    c.remove()
    return out
  }

  /** a model that breaks while it is built, past the checks and the download: wherever it breaks, the character before
   *  stays as it was (every pixel, every field, what is on the GPU) and the next good model plays. k: the character
   *  standing there, in motion so that a spring put back wrong would show; b: the one that breaks, with chains and keyforms */
  window.runKeep = async (k, b) => {
    const c = document.createElement('canvas')
    c.style.cssText = 'width: 200px; height: 240px'
    document.body.append(c)
    const p = new Player(c, { autoplay: false, followPointer: false, idle: false }), pup = p.puppet, gl = pup.gl
    const live = { texture: 0, buffer: 0, vertexArray: 0 }
    for (const [kind, make, free] of [['texture', 'createTexture', 'deleteTexture'], ['buffer', 'createBuffer', 'deleteBuffer'], ['vertexArray', 'createVertexArray', 'deleteVertexArray']]) {
      const m = gl[make], f = gl[free]
      gl[make] = function () { live[kind]++; return m.call(gl) }
      gl[free] = function (t) { if (t) live[kind]--; return f.call(gl, t) }
    }
    const kept = await filesOf(k, bare(await json(k))), broken = await filesOf(b, bare(await json(b)))
    const grab = () => {
      const o = document.createElement('canvas'); o.width = c.width; o.height = c.height
      const x = o.getContext('2d', { willReadFrequently: true })
      x.drawImage(c, 0, 0)
      return x.getImageData(0, 0, o.width, o.height).data
    }
    const fields = () => JSON.stringify({ name: pup.model?.name, layers: pup.layers.length, chains: pup.chains, drive: pup.drive, body: pup.body, bust: pup.bust, lastHead: pup.lastHead,
      smile: pup.smileShown, mouth: [pup.mouthFrame, pup.mouthW, pup.mouthHeld, pup.talkLeft, pup.frameKind, pup.frameJaw], keys: [pup.keys, pup.kfOff], rig: pup.rig, tuning: pup.tuning,
      time: pup.time, runs: pup.chainRuns.map((C) => [...C.p]), params: pup.params, player: p.model?.name })
    const stand = async () => {
      await p.load(kept)
      Object.assign(p.params, { angleX: 25, mouthOpen: 0.8, smile: 1 })
      for (let i = 0; i < 25; i++) p.draw(1 / 60)
      p.draw(0)
    }
    /** each arms one failure and returns how to take it away, which says whether the load got there */
    const places = {
      // nothing breaks: what the comparison below does with no failure at all (the good model simply plays)
      none: null,
      // the chains, the first thing built
      chain() { const f = Array.prototype.flat; let n = 0; Array.prototype.flat = function () { n++; throw new Error('injected') }; return () => { Array.prototype.flat = f; return n > 0 } },
      // a layer, part of the way through the list: those before it are on the GPU
      layer() { const f = pup.buildLayer; let n = 0; pup.buildLayer = function (...a) { if (++n === 4) throw new Error('injected'); return f.apply(this, a) }; return () => { delete pup.buildLayer; return n >= 4 } },
      // an upload, inside a layer: its mesh and some of its textures are on the GPU
      upload() { const f = gl.texImage2D; let n = 0; gl.texImage2D = function (...a) { if (++n === 3) throw new Error('injected'); return f.apply(gl, a) }; return () => { delete gl.texImage2D; return n >= 3 } },
      // the springs: the layers are done and most fields are already the new model's
      physics() { let n = 0; pup.resetPhysics = function () { n++; throw new Error('injected') }; return () => { delete pup.resetPhysics; return n > 0 } },
      // the keyforms, last and heaviest, in the middle of swapping the pose for its own
      keyforms() { const f = pup.prepareKeyforms; let n = 0; pup.prepareKeyforms = function (K) { n++; return f.call(this, { ...K, keys: [K.keys[0], null] }) }; return () => { delete pup.prepareKeyforms; return n > 0 } },
      // the GPU out of memory: nothing throws, it says so afterwards
      memory() { let n = 0; gl.getError = function () { return n++ ? gl.OUT_OF_MEMORY : gl.NO_ERROR }; return () => { delete gl.getError; return n > 1 } },
    }
    const out = {}
    for (const [name, arm] of Object.entries(places)) {
      await stand()
      const px = grab(), state = fields(), gpu = JSON.stringify(live)
      if (!arm) { p.draw(0); out[name] = { differ: differs(px, grab()) }; continue }
      const done = arm()
      const said = await p.load(broken).then(() => null, (e) => String(e.message || e))
      const reached = done(), after = fields(), gpuAfter = JSON.stringify(live)
      p.draw(0)
      const differ = differs(px, grab())
      const next = await p.load(broken).then((m) => m.name, (e) => `refused: ${e.message}`)
      p.draw(1 / 60)
      out[name] = { said, reached, differ, sameFields: state === after, sameGpu: gpu === gpuAfter, next, glError: gl.getError() }
    }
    p.dispose()
    out.left = { ...live }
    c.remove()
    return out
  }
  const differs = (a, b) => { let n = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) n++; return n }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  /** until the condition holds, or some seconds: what a browser does next may take a while on a busy machine */
  const until = async (cond, ms = 5000) => { for (const t0 = performance.now(); !cond() && performance.now() - t0 < ms;) await wait(10) }
  const nameOf = (m) => m.name, errName = (e) => e.name

  /** several loads at once, and calling a load off: the last one plays, the others stop and say so. Slow: a route of
   *  smoke.mjs that takes about a second */
  window.runLoads = async ([a, b, d]) => {
    const c = document.createElement('canvas')
    c.style.cssText = 'width: 160px; height: 200px'
    document.body.append(c)
    const p = new Player(c, { autoplay: false, followPointer: false }), out = {}
    const slow = (id) => `/__slow/${id}.livliv`
    // three in a row: only the last goes in
    let went = 0
    const install = p.puppet.install
    p.puppet.install = function (...args) { went++; return install.apply(this, args) }
    const first = p.load(slow(a)).then(nameOf, errName)
    await wait(120)
    const second = p.load(slow(b)).then(nameOf, errName)
    await wait(120)
    const third = await p.load(`../characters/${d}.livliv`).then(nameOf, errName)
    out.row = { first: await first, second: await second, third, shown: p.model?.name, went }
    delete p.puppet.install
    // nobody catching: a replaced load reports nothing, a real error is reported as ever
    const unhandled = []
    const note = (e) => { unhandled.push(e.reason?.code ?? e.reason?.name); e.preventDefault() }
    addEventListener('unhandledrejection', note)
    p.load(slow(a))
    await p.load(`../characters/${b}.livliv`)
    await wait(80)
    out.quiet = unhandled.length
    p.load('/__nothing-here.livliv')
    await until(() => unhandled.length)
    await wait(50)
    out.loud = [...unhandled]
    removeEventListener('unhandledrejection', note)
    // a signal already aborted: refused at once, and it leaves the running load alone
    const running = p.load(`../characters/${a}.livliv`).then(nameOf, errName)
    const off = new AbortController()
    off.abort()
    out.already = { said: await p.load(`../characters/${d}.livliv`, { signal: off.signal }).then(nameOf, errName), running: await running }
    // one's own signal: the load stops, the character stays, the reason is its own
    const before = p.model.name
    const own = new AbortController()
    const mine = p.load(slow(b), { signal: own.signal }).then(nameOf, errName)
    await wait(120)
    own.abort()
    out.own = { said: await mine, kept: p.model.name === before }
    const why = new AbortController()
    const reason = p.load(slow(b), { signal: why.signal }).then(nameOf, (e) => e.message)
    await wait(50)
    why.abort(new Error('my reason'))
    out.reason = await reason
    // progress, for each way a model comes
    const steps = async (source) => { const seen = []; await p.load(source, { onProgress: (s) => seen.push(s) }); return seen }
    out.progress = { package: await steps(slow(a)), unknown: await steps(`/__slow-nosize/${a}.livliv`), folder: await steps(`../characters/${a}/`), files: await steps(await filesOf(a, await json(a))) }
    // a callback that throws does not break the load
    const log = console.error
    console.error = () => {}
    out.badCallback = await p.load(`../characters/${a}.livliv`, { onProgress() { throw new Error('mine') } }).then(nameOf, (e) => e.message)
    console.error = log
    // disposed while it runs
    const going = p.load(slow(b)).then(nameOf, (e) => [e.name, e.message])
    await wait(80)
    p.dispose()
    out.disposed = await going
    out.after = await p.load(slow(b)).then(nameOf, errName)
    c.remove()
    return out
  }

  /** the WebGL context lost, and given up */
  window.runContext = async (id, big = true) => {
    const out = {}
    const box = () => { const c = document.createElement('canvas'); c.style.cssText = 'width: 60px; height: 80px'; document.body.append(c); return c }
    const pk = `../characters/${id}.livliv`
    const lose = (p) => p.puppet.gl.getExtension('WEBGL_lose_context').loseContext()
    const code = (e) => e.code ?? e.name
    {
      // lost: the page is told once, nothing draws or throws, a load says so at once, and one running is called off
      const c = box(), p = new Player(c, { followPointer: false })
      await p.load(pk)
      let told = 0
      p.onContextLost = () => told++
      out.before = p.contextLost
      const going = p.load(`/__slow/${id}.livliv`).then(() => 'loaded', code)
      await wait(60)
      lose(p)
      await until(() => told)
      out.running = await going
      out.told = told
      out.lost = p.contextLost
      out.load = await p.load(pk).then(() => 'loaded', code)
      p.play(); await wait(120)  // frames on a lost context
      p.resize(); out.snapshot = typeof p.snapshot()
      p.dispose()
      out.newOnLost = (() => { try { new Player(c); return 'made' } catch (e) { return code(e) } })()
      c.remove()
    }
    {
      // released: gone one task later, and the canvas says so; the page is not told of its own doing
      const c = box(), p = new Player(c, { followPointer: false }), gl = p.puppet.gl
      await p.load(pk)
      let told = 0
      p.onContextLost = () => told++
      p.dispose({ release: true })
      out.sameTask = gl.isContextLost()
      await until(() => gl.isContextLost())
      await wait(30)
      out.nextTask = gl.isContextLost()
      out.releasedTold = told
      out.reuse = (() => { try { new Player(c); return 'made' } catch (e) { return code(e) } })()
      c.remove()
    }
    {
      // a framework's unmount and mount of one canvas, in one task: the new player keeps the context
      const c = box()
      const a = new Player(c, { followPointer: false })
      await a.load(pk)
      let told = 0
      a.onContextLost = () => told++
      a.dispose({ release: true })
      const b = new Player(c, { followPointer: false })
      await wait(30)
      out.remount = { lost: b.contextLost, loaded: await b.load(pk).then((m) => !!m.name, code), told }
      b.resize()
      out.remount.share = (() => { const x = document.createElement('canvas'); x.width = c.width; x.height = c.height; const g2 = x.getContext('2d', { willReadFrequently: true }); g2.drawImage(c, 0, 0); const d = g2.getImageData(0, 0, x.width, x.height).data; let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i]) n++; return n / (d.length / 4) })()
      b.dispose({ release: true })
      c.remove()
    }
    if (big) {
      // characters coming and going beside one that stays: with release it stays, without it is pushed out
      const stay = box(), keep = new Player(stay, { followPointer: false, autoplay: false })
      await keep.load(pk)
      let told = 0
      keep.onContextLost = () => told++
      for (let i = 0; i < 40; i++) {
        const c = box(), p = new Player(c, { followPointer: false, autoplay: false })
        p.dispose({ release: true })
        c.remove()
        await wait(0)
      }
      await wait(50)
      out.withRelease = { lost: keep.contextLost, told }
      const others = []
      for (let i = 0; i < 20; i++) { const c = box(); others.push(new Player(c, { followPointer: false, autoplay: false })); await wait(0) }
      await until(() => told, 2000)
      out.withoutRelease = { lost: keep.contextLost, told }
      out.overLimitLoad = await keep.load(pk).then(() => 'loaded', code)
      keep.dispose()
      for (const p of others) { p.dispose({ release: true }); p.canvas.remove() }
      stay.remove()
      await wait(30)
    }
    return out
  }

  /** the poster: on the canvas until the first frame, the canvas's own background back after */
  window.runPoster = async (id) => {
    const c = document.createElement('canvas')
    c.style.cssText = 'width: 160px; height: 200px; background-color: rgb(1, 2, 3)'
    document.body.append(c)
    const look = () => { const s = getComputedStyle(c); return { image: s.backgroundImage, size: s.backgroundSize, repeat: s.backgroundRepeat, color: s.backgroundColor } }
    const poster = `../characters/${id}/cover.webp`, out = {}
    const clean = look()
    let p = new Player(c, { autoplay: false, followPointer: false })
    const going = p.load(`/__slow/${id}.livliv`, { poster })
    out.during = look()
    await going
    out.after = look()
    out.same = JSON.stringify(out.after) === JSON.stringify(clean)
    // over a character: none, that one stays until the next is ready
    const next = p.load(`/__slow/${id}.livliv`, { poster })
    out.over = look().image
    await next
    p.dispose()
    // a load that fails takes it away, so that the page can say why
    p = new Player(c, { autoplay: false, followPointer: false })
    const refused = p.load('/__nothing-here.livliv', { poster }).catch(() => {})
    out.failing = look().image
    await refused
    out.failed = look().image
    // replaced by a load without one: gone at once; with one: that one
    const a = p.load(`/__slow/${id}.livliv`, { poster }).catch(() => {})
    const b = p.load(`/__slow/${id}.livliv`)
    out.replaced = look().image
    await a; await b
    p.dispose()
    // disposed while it shows
    p = new Player(c, { autoplay: false, followPointer: false })
    const d = p.load(`/__slow/${id}.livliv`, { poster }).catch(() => {})
    p.dispose()
    await d
    out.disposed = look().image
    c.remove()
    return out
  }

  /** random changes to a model.json, in the real player: whatever happens, the player goes on working. Refused: the model
   *  before is still drawn. Loaded: the frames do not throw. And a good model after any of them draws (nothing is poisoned) */
  window.runFuzz = async (id, keep, from, to) => {
    const canvas2 = document.createElement('canvas')
    canvas2.style.cssText = 'width: 160px; height: 160px'
    document.body.append(canvas2)
    let p = new Player(canvas2, { autoplay: false, followPointer: false })
    await p.load(`../characters/${keep}/`)
    const base = await json(id), files = await filesOf(id, base)
    let frameErrors = 0
    const onError = () => { frameErrors++ }
    addEventListener('error', onError)
    const rng = (seed) => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 2 ** 32 }
    const NASTY = [null, -1, 0, 1, 0.5, 2, 1e9, -1e9, 1e308, 'x', '', [], {}, true, [1, 2], [null], [[1]], { x: 1 }, 'smile']
    const mutate = (v, r) => {
      const pick = (xs) => xs[Math.floor(r() * xs.length)], root = { v }
      let parent = root, key = 'v'
      for (let d = 0; d < 8 && r() < 0.85; d++) {
        const cur = parent[key]
        if (!cur || typeof cur !== 'object') break
        const keys = Array.isArray(cur) ? cur.map((_, i) => i) : Object.keys(cur)
        if (!keys.length) break
        parent = cur; key = pick(keys)
      }
      if (r() < 0.25) { if (Array.isArray(parent)) parent.splice(key, 1); else delete parent[key] } else parent[key] = pick(NASTY)
      return root.v
    }
    const nan = () => p.puppet.layers.some((L) => L.out.length && Number.isNaN(L.out[0]))
    const counts = { refused: 0, loaded: 0, blank: 0 }, wrong = []
    for (let seed = from; seed <= to; seed++) {
      const r = rng(seed)
      let m = JSON.parse(JSON.stringify(base))
      for (let k = 1 + Math.floor(r() * 2); k > 0; k--) m = mutate(m, r)
      const map = new Map(files)
      map.set(`${id}/model.json`, new Blob([JSON.stringify(m)]))
      const before = frameErrors
      let refused = null
      try { await p.load(map) } catch (e) { refused = String(e.message || e) }
      try { p.draw(1 / 60); p.draw(1 / 60) } catch { frameErrors++ }
      if (refused) {
        counts.refused++
        if (p.puppet.model.name !== p.model.name || !p.puppet.layers.length) wrong.push(`#${seed} the model before is gone: ${refused.slice(0, 90)}`)
      } else {
        counts.loaded++
        if (nan()) counts.blank++
      }
      if (frameErrors > before) wrong.push(`#${seed} a frame threw`)
      if (refused === null || wrong.length) {
        await p.load(`../characters/${keep}/`)
        p.draw(1 / 60)
        if (nan()) wrong.push(`#${seed} the next good model draws NaN`)
      }
    }
    removeEventListener('error', onError)
    p.dispose(); canvas2.remove()
    return { counts, wrong: wrong.slice(0, 8) }
  }

  /** a package's connection dropping (the flaky routes of smoke.mjs): once, it is tried again and plays; always, the page
   *  gets our words, not the browser's; a 404 is not tried again */
  window.runDropped = async (id) => {
    const p = new Player(canvas, { autoplay: false, followPointer: false })
    const tell = (route) => p.load(route).then((m) => `played ${m.name}`, (e) => { said.push([e.code, e.status]); return e.message })
    const said = []
    const out = { said, once: await tell(`/__dropped/once/${id}.livliv`), always: await tell(`/__dropped/always/${id}.livliv`), missing: await tell('/__dropped/missing/x.livliv') }
    p.dispose()
    return out
  }

  /** a full-body character, made from a featured one: its canvas twice as tall, the body layer stretched down to the
   *  ground, hips, knees, ankles and a hem where a figure would have them, and the frame its old canvas. What is checked:
   *  the three shots, the feet staying on the ground through a crouch, the talking dip, a recorded pose replayed */
  window.runFullBody = async (id) => {
    const m = bare(await json(id)), [W, H] = m.canvas, A = m.anchors
    const body = m.layers.reduce((a, L) => (L.group === 'body' && L.w * L.h > (a?.w ?? 0) * (a?.h ?? 0) ? L : a), null)
    const tall = { ...m, canvas: [W, 2 * H], rig: { ...m.rig, lattice: Math.max(6, Math.round(Math.max(W, H) / 128)) },
      layers: m.layers.map((L) => (L === body ? { ...L, h: Math.round(1.95 * H) - L.y } : L)),
      anchors: { ...A, bottom_y: 1.95 * H, frame: [0, 0, W, H], hair_bottom_y: A.bottom_y,
        body: { hip_l: [0.6 * W, 1.15 * H, 0.9], hip_r: [0.4 * W, 1.15 * H, 0.9], knee_l: [0.59 * W, 1.5 * H, 0.9], knee_r: [0.41 * W, 1.5 * H, 0.9],
          ankle_l: [0.58 * W, 1.9 * H, 0.9], ankle_r: [0.42 * W, 1.9 * H, 0.9], ground_y: 1.95 * H, hem_y: 1.3 * H, hem_x: [0.3 * W, 0.7 * W] } } }
    const p = new Player(canvas, { autoplay: false, followPointer: false, idle: false })
    const out = {}
    const half = await p.load(await filesOf(id, m))
    out.half = { fullBody: half.fullBody, keys: Object.keys(p.getPose()).sort().join() }
    const info = await p.load(await filesOf(id, tall))
    out.fullBody = info.fullBody; out.size = info.size.join()
    // the shots: the head drawn largest in the frame, smallest with the whole figure
    out.shots = {}
    for (const fit of ['frame', 'knee', 'whole']) {
      p.view.fit = fit; p.resize()
      out.shots[fit] = { head: p.getAnchor('head').scale, share: covered() }
    }
    // the feet: the lowest row drawn, with room below (zoom 0.8), at rest and in a crouch
    p.view.fit = 'whole'; p.view.zoom = 0.8
    const lowest = () => {
      const d = pixels(), w = canvas.width
      for (let y = canvas.height - 1; y >= 0; y--) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 128) return canvas.height - 1 - y
      return -1
    }
    p.resize()
    out.restFeet = lowest()
    // a lean toward the camera, a talking bob and a move sideways, from a driver as face tracking and lip sync write them
    let lean = -0.03, talk = -0.01, side = 0.05
    p.use({ update(f) { f.move.y += lean; f.talk += talk; f.move.x += side } })
    p.resize()
    const pose = p.getPose()
    out.pose = { crouch: pose.crouch, dip: pose.dip, talk: pose.talk, y: pose.move.y, x: pose.move.x, fit: pose.view.fit }
    out.crouchFeet = lowest()
    // replayed, the same frame; without its crouch and dip, another; a pose that would sink it whole (as a half-body
    // character moves) keeps its feet on the ground, a hop's lift raises them
    const live = pixels()
    p.renderPose(pose)
    out.replayed = changed(live, pixels())
    p.renderPose({ ...pose, crouch: 0, dip: 0 })
    out.without = changed(live, pixels())
    p.renderPose({ ...pose, move: { ...pose.move, y: pose.move.y + (pose.crouch ?? 0) }, crouch: 0, dip: 0 })
    out.sunkFeet = lowest()
    p.renderPose({ ...pose, move: { ...pose.move, y: 0.05 }, crouch: 0, dip: 0 })
    out.liftFeet = lowest()
    // a lean away is not followed (the figure would float), and a hop lands on its feet
    lean = 0.05; talk = 0; side = 0
    p.play(); p.pause(); p.resize()
    out.leanAway = { y: p.getPose().move.y, crouch: p.getPose().crouch }
    lean = 0
    // a driver that writes something that is no number, once: the springs carry on, the figure stays
    side = NaN; p.play(); p.pause(); p.resize(); side = 0
    for (let i = 0; i < 3; i++) p.resize()
    out.afterNaN = { x: p.getPose().move.x, hem: Number.isFinite(p.puppet.fbm.hem), share: covered() }
    // a recorded pose asking for more than live motion could: held to it
    p.renderPose({ ...pose, move: { ...pose.move, y: -0.3 }, crouch: -1, dip: -1 })
    const held = p.getPose()
    out.held = { y: held.move.y, crouch: held.crouch, dip: held.dip }
    out.anchors = { head: !!p.getAnchor('head'), body: !!p.getAnchor('body') }
    p.dispose()
    return out
  }

  /** hostile packages: each must be refused (or, for broken keyforms, played on the rig alone), the model before kept */
  window.runHostile = async (id, kfId) => {
    const player = new Player(canvas, { autoplay: false, followPointer: false })
    const m = await json(id), first = m.layers[0], tex = first.texture
    await player.load(`../characters/${id}/`)
    const bomb = await (await fetch('/__bomb.png')).blob()
    const cases = {
      bomb: filesOf(id, m, { [tex]: bomb }),
      path: filesOf(id, { ...m, layers: [{ ...first, texture: 'textures/../../package.json' }, ...m.layers.slice(1)] }),
      canvas: filesOf(id, { ...m, canvas: [100000, 100] }),
      box: filesOf(id, { ...m, layers: [{ ...first, w: 1e9 }, ...m.layers.slice(1)] }),
      json: filesOf(id, '{ "format": "livliv-model", '),
      layers: filesOf(id, { ...m, layers: Array.from({ length: 600 }, () => first) }),
      chain: filesOf(id, { ...m, rig: { ...m.rig, chains: [{ points: [[0, 0], [1, 1]] }] } }),
      browLine: filesOf(id, { ...m, anchors: { ...m.anchors, brows: [[1, 1, 5, 5]], brow_lines: [{ x: [1, 2] }] } }),
      rig: filesOf(id, { ...m, rig: { ...m.rig, roll: 'x' } }),
      mesh: filesOf(id, { ...m, layers: Array.from({ length: 25 }, (_, i) => ({ ...first, id: `l${i}`, x: -m.canvas[0], y: -m.canvas[1], w: 3 * m.canvas[0], h: 3 * m.canvas[1] })) }),
    }
    const out = {}
    for (const [k, files] of Object.entries(cases)) {
      try { await player.load(await files); out[k] = { loaded: true } } catch (e) { out[k] = { refused: String(e.message || e), code: e.code, kept: player.model?.name } }
    }
    // keyforms that are not right: the character still plays, on the rig alone
    const kf = await json(kfId)
    try {
      const bad = new Blob([JSON.stringify({ version: 1, cols: 65, rows: 97, cell: 16, units: 0.1, turn: 0.8, nod: 1, keys: [{ param: 'angleX', value: 30, fields: { head: 'AAAA' } }] })])
      const info = await player.load(await filesOf(kfId, kf, { [kf.files.keyforms]: bad }))
      player.resize()
      out.keyforms = { loaded: true, name: info.name, share: covered() }
    } catch (e) { out.keyforms = { refused: String(e.message || e) } }
    player.dispose()
    return out
  }
</script>
